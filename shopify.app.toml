# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
#
# Linked to the "digitalsuitstest" app in the Dev Dashboard.
client_id = "ec506ad6ee410cef07968c91c2a7913c"
name = "digitalsuitstest"
# Public URL of the webhook server (see README → "Deploy the webhook server").
application_url = "https://order-text-webhooks.onrender.com"
embedded = false

[build]
automatically_update_urls_on_dev = false

[access_scopes]
# read_orders/write_orders → receive orders/create and write the order metafield.
scopes = "read_orders,write_orders"

[auth]
redirect_urls = ["https://order-text-webhooks.onrender.com/auth/callback"]

[webhooks]
api_version = "2026-10"

  # Task 1 — fires every time a new order is created in the store.
  [[webhooks.subscriptions]]
  topics = ["orders/create"]
  uri = "https://order-text-webhooks.onrender.com/webhooks/orders/create"

# Task 1 — app-owned metafield definition, created automatically on `shopify app deploy`.
# Admin API reference: namespace "$app", key "random_text".
[order.metafields.app.random_text]
name = "digitalsuitstest"
description = "Random Lorem Ipsum text generated by the orders/create webhook."
type = "multi_line_text_field"
access.admin = "merchant_read"
